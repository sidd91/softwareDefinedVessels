[project]
name = "sdv-governor"
version = "0.1.0"
description = "Resource governor for a software-defined multi-role vessel (Fincantieri SDV challenge)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
sdv = "sdv.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
