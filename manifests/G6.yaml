  compute_cores: {nominal: 1, assumed: true}
modes:
  - {name: production, power_kw: 18, capability_retained: 1.0, assumed: true}
  - {name: recirculate, power_kw: 4, capability_retained: 0.1, assumed: true, note: "keeps membranes wet, produces nothing"}
