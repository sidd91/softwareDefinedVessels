d5_r3_14_confirm:
  sentence: Bridge asked to confirm G4's recovery at 14 aboard, on the landing officer's deck report. G4 at 18 % must land by minute 18.2.
  source: 'SCENARIO_C_MEMO 14 aboard: the bridge is asked at minute 8 with the D3 decision; land by 18.2'
d5_r3_14_held:
  sentence: 'Recovery held at 14 aboard: the landing officer reports the zone not clear. G4 at 18 % must start its 4 min approach by minute 14.2 to land by 18.2.'
  source: 'SCENARIO_C_MEMO effect at 14: the landing officer reports not clear; start the 4 min approach by 14.2'
d5_r3_6_not_now:
  sentence: 'Not now at 6 aboard: deck work (3 min) waits until G4 is secured. Deck clearing lead 15 min against 8 min, 7 min over.'
