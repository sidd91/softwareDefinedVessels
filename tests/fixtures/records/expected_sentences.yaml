d3_m08_sar:
  sentence: 'G4 recovers first: below 20 % it must land within 12 min, by minute 18.2, and G3''s leg runs to minute 40. G3''s leg is aborted, at least 25 to 27 survey minutes lost with no resume time, and
    G4''s 35 kW charge is reserved.'
  source: oracle scenario_b.minute_8 sar
d3_m08_survey:
  sentence: 'G4 recovers first: below 20 % it must land within 12 min, by minute 18.2, and G3''s leg runs to minute 40. G3 holds depth and loses 25 to 27 survey minutes, its leg now ending at minute 65
    to 67.'
  source: oracle scenario_b.minute_8 survey
d4_m12_sar:
  sentence: 'Holds: 82.5 of 95 kW with one genset down and G4''s 35 kW reserved, 0 steps, no capability lost. Armed in order: G5 full to low power, 45 to 8 kW, frees 37 kW (70 % lost), then G5 low power to off, 8 to 0 kW, frees 8 kW (30 % lost), then G3 standby to off, 1 to 0 kW, frees 1 kW (30 % lost), then G1 full to off, 1.5 to 0 kW, frees 1.5 kW (100 % lost), then G4 standby to off, 2 to 0 kW, frees 2 kW (30 % lost). The envelope case does not arise: G1 full 1.5 kW, G3 charging 25 kW, G4 fast charge 35 kW and G5 full 45 kW would be 106.5 kW against the 95 kW limit, but G3 is holding at sea in standby (1 kW).'
  source: 'oracle scenario_b.minute_12_as_decided sar (DEC-63 load-out: G1 full 1.5 kW on the bus beside G3 1, G4 35 reserved, G5 45); the armed ladder as the engine orders it from the snapshot (DEC-60: 5 S steps first, G1 off the last of them, the 60 S G4 last); the envelope set is the oracle''s draw set B on load-out ii (one_genset_down_envelope 106.5 kW), with G3 holding at sea at its 1 kW standby'
d4_m12_survey:
  sentence: 'Holds: 49.5 of 95 kW with one genset down, 0 steps, no capability lost. Armed in order: G5 full to low power, 45 to 8 kW, frees 37 kW (70 % lost), then G5 low power to off, 8 to 0 kW, frees 8 kW (30 % lost), then G4 standby to off, 2 to 0 kW, frees 2 kW (30 % lost), then G1 full to off, 1.5 to 0 kW, frees 1.5 kW (100 % lost), then G3 standby to off, 1 to 0 kW, frees 1 kW (30 % lost). The envelope case does not arise: G1 full 1.5 kW, G3 charging 25 kW, G4 fast charge 35 kW and G5 full 45 kW would be 106.5 kW against the 95 kW limit, but G3 is holding depth in standby (1 kW) and G4 is airborne in standby (2 kW).'
  source: 'oracle scenario_b.minute_12_as_decided survey (DEC-63 load-out: G1 full 1.5 kW on the bus beside G3 1, G4 2, G5 45); the armed ladder as the engine orders it from the snapshot (5 S steps first, G1 off the last of them, the 60 S G3 last); the envelope set is the oracle''s draw set B on load-out ii (one_genset_down_envelope 106.5 kW), with G3 holding depth at its 1 kW standby and G4 airborne at its 2 kW standby'
d4_m19_sar:
  sentence: 'Cooling binds with one chilled-water pump down: 81 kW against the 75 kW limit. G5 full to low power, 45 to 8 kW, frees 37 kW and the load is 44 kW: G5 loses 70 %, G1, G3 and G4 nothing.'
  source: 'EXPECTED_OUTCOMES ''Scenario B as decided'', minute 19, sar: cooling binds on the loop (G3 1 + G4 35 + G5 45 = 81 against 75), G1''s air-cooled 1.5 kW is on the bus (82.5 against 95) and loses nothing'
d4_m19_survey:
  sentence: 'Cooling binds with one chilled-water pump down: 81 kW against the 75 kW limit. G4 fast charge to charge, 35 to 10 kW, frees 25 kW and the load is 56 kW: G4 loses 30 %, G1, G3 and G5 nothing.'
  source: 'EXPECTED_OUTCOMES ''Scenario B as decided'', minute 19, survey: cooling binds on the loop (81 against 75), G1''s air-cooled 1.5 kW is on the bus (82.5 against 95) and loses nothing'
d5_r3_0_automatic:
