# The expected sentence for every decision-record fixture in this folder and in cases/, and where its numbers come
# from. tests/test_explain.py checks that src/sdv/explain.py builds exactly this sentence from the record's fields and
# that the record's own `sentence` field says the same. Change a sentence here and in the record together.
