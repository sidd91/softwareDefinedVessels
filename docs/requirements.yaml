- id: R-007
  category: deliverable
  called_out: true
  requirement: 'Headline deliverable: build a resource governor that acts as the missing operating system for a
    reconfigurable multi-role vessel.'
  sources:
  - brief p1, title
  - slides p2
  - slides p5
  quote: A Resource Governor for a Re-configurable Multi-Role Vessel
  how: 'Mechanism (GAMEPLAN core model, locked as DEC-15 to DEC-17): one pure-Python deterministic core. PlatformModel
    reads config/assumptions.yaml; Guest objects come from manifests/*.yaml; a ShipState machine holds the A.6 variables;
    D1 to D4 each return Decision{verdict, binding, why}; MissionContext layers the priority file, overrides and
    crew level; a seeded 1 Hz simulator writes a decision log that replay must reproduce; one screen reads it. Binding
    numbers: eight resource classes, 200 kW guest reserve at cruise and 100 kW with one genset down, cooling 160
    kW at 12 °C falling to 120 kW at 30 °C, 10 t mass margin, one free mast slot. Today only the data layer is built
    (11 tests pass); the README''s Decision classes table marks D1 to D4 planned and its Architecture diagram is
    design only, and sdv.cli is declared but missing. M1 has slipped (CON-10). Proof: both deep demos in docs/DEMO_SCRIPT.md
    plus a replay test.'
