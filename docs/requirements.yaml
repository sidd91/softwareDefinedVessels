  - DEC-17
  status: drafted
  question: With only 12 s of margin at 14 aboard, do we keep the trigger on the drain trend or assume a faster
    drain so the window opens earlier and the live demo cannot miss it?
- id: R-012
  category: deliverable
  called_out: true
  requirement: The memo must state the rule's effect.
  sources:
  - brief p3, Scenario table, C (good handling)
  quote: its trigger and effect
  how: 'Mechanism: the memo''s Effect section. While hold is true, R3 withholds clearance to land within 200 ms
    (A.8) and no priority file lifts it, so D3, which applies hard limits before mission weights, cannot trade it
    away. Inside the window it forbids new tasks in the zone except clearing and the sweep; it allows landing once
    the zone is clear and the A.3 flight-deck limits hold (wind up to 25 kn, sea state up to 4, 5-12 kn, steady
    course). Card exclusions apply meanwhile: no winch (G2) and no ramp work. The bridge sentence names the evidence
    (marker FD-2 covered, frame 0.4 s old) and the minutes left. Today the 200 ms ceiling is in data as response_time_s.safety_command
    0.2. Missing: the RuleEngine and the 200 ms hold path. Proof: DEMO_SCRIPT''s ''Landing zone not clear'' breadth
    line and memo Live demo step 1, with latency_ms logged against the 200 ms ceiling.'
  links:
  - label: 'Memo: effect'
    path: docs/SCENARIO_C_MEMO.md#effect
