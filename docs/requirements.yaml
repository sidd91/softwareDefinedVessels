    the event, deterministic rules with a one-sentence binding constraint, and throttle before shed. Binding numbers:
    our ceilings of 30 s, 2 s, 5 s, 60 s and 200 ms (A.8), against QoS shedding stages of 2 s, 45 s and 5 min. Today:
