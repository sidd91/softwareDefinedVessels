    owner for each?
- id: R-002
  category: deliverable
  called_out: true
  requirement: The prototype must be a runnable, functional resource governor executable, not mockups.
  sources:
  - slides p14
  quote: The functional resource governor executable.
  how: 'Mechanism: the `sdv` console script declared in pyproject.toml (sdv = sdv.cli:main) will load config/assumptions.yaml,
    manifests/G*.yaml and one config/missions file, build the ledger, and run D1 to D4 as pure functions that each
    return a decision record with the binding ledger line, sentence, latency_ms and ceiling_ms (ARCHITECTURE data
    contract 6). Binding numbers: ceilings of 30 s admission, 2 s arbitration, 5 s first shed and 60 s full sequence
    (A.8); runs on a laptop (brief p5 Constraints), offline (brief p3, ''Would it run on the platform''). Today:
    src/sdv holds only __init__.py and sdv/cli.py does not exist, so the declared entry point cannot run; the only
    working command is `uv run pytest` (11 data checks pass, README ''Run it''). Missing: CLI, ledger, engines,
    simulator, replay. Proof: `uv run sdv demo scenario-b --priority sar` driving DEMO_SCRIPT''s Scenario B, with
    latency_ms logged against ceiling_ms in every record.'
  links:
  - label: Entry point (module missing)
    path: pyproject.toml
  - label: Package stub
    path: src/sdv/__init__.py
  - label: 'README: Run it'
    path: README.md#run-it
  - label: Decision record contract
    path: docs/ARCHITECTURE.md#data-contracts
  - label: 'Demo: Scenario B'
    path: docs/DEMO_SCRIPT.md#scenario-b-90-s-deep
