  sources:
  - brief p1, Area
  - slides p10
  - brief p5, Constraints
  quote: graceful degradation on a 60–70 m multi-role vessel
  how: Planned as D4; model locked, no code. Ceiling = tighter of degraded power (100 kW) and cooling at current
    seawater (160 kW at 12 C to 120 kW at 30 C, x0.6 degraded), minus 5 kW headroom (power.shed_headroom_kw). Steps
    come from each card's modes ladder (G5 45 -> 8 -> 0 kW; G2 20 -> 6 -> 1 -> 0; G4 35 -> 10 -> 2 -> 0), priced
    as mission weight x capability lost / kW freed; all throttles before any shed; mission-critical last; safety-critical
    never listed; ties by guest id; power and heat rechecked after every step; restore in reverse with a hold-off.
    Precomputed every tick as 'if a genset tripped now', so the first action is a lookup. A trip counts only on
    2 of 3 signals. While generator state is uncertain, new admissions are judged as if one genset is down. So the
    order is throttle, then shed, and refuse new work as if degraded.
