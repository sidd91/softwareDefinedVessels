- id: R-014
  category: deliverable
  called_out: true
  requirement: For each crew level the memo states what becomes automatic.
  sources:
  - brief p3, Scenario table, C (good handling)
  quote: what becomes automatic
  how: 'Mechanism: the memo table''s ''Automatic'' column, planned as D5 policy outputs that need no human. At 14
    the governor makes the clear-deck call when the window opens and holds or releases landing itself. At 6 it keeps
    the zone clear from launch to secured and refuses deck, winch and ramp work for up to 90 min, G4''s endurance;
    extending the recovery-only exclusions to the whole sortie is our choice, not the brief''s. At 0 it refuses
    launch unless recovery stays possible for the 90 min sortie (assumption r3.uncrewed_launch) and lands only on
    a fresh ''unchanged, empty'' camera reading. Binding numbers: 90 min endurance, 12 min to land below 20 %, 200
    ms hold. Proof: memo Live demo step 2, where a deck work request at sortie min 3 is allowed at 14 and refused
    at 6 (''not now; when: after G4 is secured'').'
