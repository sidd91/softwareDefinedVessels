- id: R-530
  category: out-of-scope
  called_out: true
  requirement: 'Out of scope: controlling machinery; the governor only requests ship states, which take the A.6
    transition times.'
  sources:
  - brief p6, Out of scope
  quote: controlling the machinery (you request ship states; transition times are given in A.6)
  how: 'Mechanism: the governor outputs decisions and requests, never actuator commands. Each action declares its
    path (GAMEPLAN, crew in two roles): a software mode change on a guest (throttle or shed down its card''s ladder,
    go silent), a ship-state request to the bridge (course, speed band, noise) that takes its A.6 time, or a human-only
    task with people and minutes (clear the deck: 3-5 min at 14, 8-12 at 6). Host commitments are counted, never
    commanded; the PMS''s own 150 kW hotel shed on a trip is an assumption we count (power.hotel_shed_on_trip_kw),
    not an order we give. Today: actuation paths in GAMEPLAN; transition times in config/assumptions.yaml ship_state.
