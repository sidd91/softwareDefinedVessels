  - slides p2
  - slides p5
  quote: A Resource Governor for a Re-configurable Multi-Role Vessel
  how: 'Not built. What exists is the data the governor will read: config/assumptions.yaml (Annex A plus tagged
    assumptions), manifests/schema.json with G1-G6, four priority files, and tests/test_brief_arithmetic.py (11
    data checks, all pass, run Fri 23:18). Planned core per GAMEPLAN: one pure-Python deterministic core (PlatformModel,
    Guest objects, ShipState machine, DecisionEngine D1-D4 each returning Decision{verdict, binding, why}, MissionContext,
    RuleEngine, seeded 1 Hz simulator with replay) plus one screen. src/sdv holds only __init__.py; pyproject.toml
    declares the `sdv` command at sdv.cli:main but that module does not exist, and README.md is one title line,
    so the brief''s one-command run and 3-page README are both open. M1 (ticking sim, one card refused with a sentence)
    was due Sat 01:30 and will move.'
