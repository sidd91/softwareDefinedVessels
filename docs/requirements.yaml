- id: R-479
  category: constraint
  called_out: true
  requirement: Compute cannot be hot-added at sea.
  sources:
  - brief p9, Annex A table, Compute (A.7)
  quote: 20 % reserved for ship systems; no hot-add.
  how: 'Mechanism: compute capacity is fixed in config/assumptions.yaml (4 nodes x 32 cores, guest_share 0.8: 102.4
    cores for guests). ''No hot-add'' therefore holds by construction: nothing in the data can raise capacity, so
    there is no explicit key. At sea compute can only fall. A node counts as dead after 1 s silent on all paths
    and its workloads are re-placed (SENSOR_CATALOG), which GAMEPLAN''s per-node compute ledger treats as a supply
    degradation. Losing one node leaves 76.8 allocatable cores against the 13 our cards declare (assumed), so compute
    will not bind in the demo unless a card is edited. A.11 allows re-allocating compute even at 0 crew; a portable
    camera is a guest on the same pool, not new capacity. Not built. Proof: a planned test that a node_down event
    (ARCHITECTURE contract 5) cuts capacity by one node''s 25.6 cores and that no event ever adds any. GAMEPLAN''s
    failover encore (killing the primary governor process) is the demo-side counterpart, not a rack-node loss.'
