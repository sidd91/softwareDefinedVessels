- id: R-528
  category: constraint
  called_out: true
  requirement: 'Anti-patterns to avoid: elastic resources, always-on connectivity, failure as a ticket, latency
    as mere cost, heat as someone else''s problem.'
  sources:
  - slides p7, Cloud-Native Logic Fails at Sea (Cloud vs Ship table)
  quote: Cloud-Native Logic Fails at Sea
  how: 'Mechanism: each cloud habit on the slide has a counter. Elastic pool: capacities are fixed in config/assumptions.yaml
    (200 kW cruise, 100 kW one genset down, 10 t mass, 4 x 32 cores with 80 % for guests, no hot-add per A.7), so
    D1 answers no or yes-if. Always-on: runtime is local (DEC-01), public data is cached, SATCOM is 2-8 Mbit/s and
    zero in silence (data.silent_zeroes). Failure as a ticket: D3 applies hard limits first (G4 below 20 % lands
    within 12 min or ditches) and unknown never means safe. Latency as cost: response_time_s ceilings of 30, 2,
    5 and 60 s and 200 ms, logged per decision, with a watchdog safe default. Heat: kw_heat_per_kw_electric 1.0
    and a cooling line that falls with seawater; test_all_five_do_not_fit_a_degraded_loop_in_30c_water passes. Missing:
    engines and watchdog. Shown: DEMO_SCRIPT Scenario B latency against ceilings, and the cable-pull and emission-silence
    breadth lines.'
  links:
  - label: 'assumptions.yaml: capacities, ceilings, heat'
    path: config/assumptions.yaml
