  quote: min-8 decision with rationale and cost to the loser
  how: 'Planned as D3 within 2 s (response_time_s.arbitration). The conflict is between card conditions on ship
    state: G3 surveying needs 3 kn, steady, quiet, no deck machinery; G4 recovery needs deck clear, 5-12 kn, freedom
    to turn into wind, wind 25 kn or less (22 kn reported). Hard limit first: below 20 % G4 must land within 12
    min or ditch, so waiting for the leg''s end at min 40 is off the table. Then utility = sum of mission weight
    x capability delivered (survey file: seabed_inspection 1.0, sar_air 0.2; sar file: sar_air 1.0, seabed_inspection
    0.2). Cost to loser, our reading: survey primary loses 23 survey min (15-min recovery window plus the 8 min
    of leg to re-run); rescue primary suspends the survey, so the cost is the survey minutes lost while G4''s 35
    kW is reserved for 20 min. Caveat: the load-out is 13.015 t (CON-12). Missing: state machine, D3, simulator
    (M2, slipping per CON-10). Shown: DEMO_SCRIPT 00:10 to 00:25. Update: decided by DEC-32; Scenario B runs G3,
    G4, G5, and the full load-out is refused at the pier with this alternative recommended and a logged override
    available. Decided (DEC-40): brief''s story at minutes 0-12 (minute-12 trip holds, D4 shows 0 steps and both
    armed ladders); G4 lands at minute 17; an added, labelled pump fault at minute 19 makes cooling bind (75 kW
