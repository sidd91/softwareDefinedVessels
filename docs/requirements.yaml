- id: R-501
  category: stack-data
  called_out: true
  requirement: 'Suggested: admission and placement as constraint satisfaction or a small MIP (OR-Tools, PuLP, MiniZinc);
    the slides add that constraint solvers beat black boxes.'
  sources:
  - brief p4, Stack, data & tools
  - slides p13, Explainable Logic
  - 'brief p3, What you''re judged on: Would it run on the platform'
  quote: constraint satisfaction or a small MIP (OR-Tools, PuLP, MiniZinc)
  how: 'Mechanism: D1 and D2 run a complete constraint search by exhaustive enumeration, not a solver library. Every
    assignment of guest parts to positions is checked against every hard constraint at each envelope corner: bay
    fit, 10 t mass margin, 12 t-eq stability with multipliers (mast x3), 150 kW per mission line, 200 or 100 kW
    reserve, cooling at 30 °C, links, 80 % compute. Feasible candidates are scored by smallest normalised margin
    in the constraint ledger; the binding line becomes the sentence and the others are the rejected alternatives.
    Numbers: 30 s ceiling for admission and placement; brief p3 warns that a solver taking four minutes has answered
    the wrong question. GAMEPLAN argues the problem is tiny (6 guests or fewer, 5 positions or fewer; assumptions.yaml
    now lists six positions with Bay 1 in two halves), so enumeration is exact; OR-Tools stays optional for D2 and
    is last in the cut order. Risk: slides p13 name constraint solvers. Today: GAMEPLAN ''Explainability by construction'';
    no code or timing. Shown: DEMO_SCRIPT Scenario A placement step with rejected alternatives.'
  links:
  - label: 'GAMEPLAN: constraint ledger'
    path: GAMEPLAN.md#explainability-by-construction-the-constraint-ledger
