- id: R-539
  category: data-use-ai
  called_out: true
  requirement: Avoid learned behaviour an adversary could study and exploit; rules must be deterministic and inspectable.
  sources:
  - 'brief p1, why containers fail: Decisions must be explainable'
  quote: an adversary who studies the system can exploit learned habits
  how: 'Mechanism: no learned behaviour sits in any decision path. D1 to D4 are pure functions of the ledger (ARCHITECTURE
    principle 2), rules come only from an approved grammar (DEC-02), and ML is kept out of the decision, as brief
    p4 advises; any model is confined to optional camera sensing (DEC-27). Predictable rules can still be studied,
    so the gameability argument rests on the sensor rules: unknown never means safe, stale data only tightens a
    limit, corroborating sensors may add a hazard but never clear one, a camera never clears another sensor''s alarm,
    and a genset trip needs 2 of 3 signals (power.trip_confirm). Spoofing can force caution (denial), not an unsafe
    yes. Today: those rules in research/SENSOR_CATALOG.md, the camera design section 6 and config/assumptions.yaml.
    Missing: a written argument in the README. Proof: a test that a spoofed ''clear'' reading cannot release a hold;
    not written.'
