- id: R-554
  category: constraint
  called_out: true
  requirement: Decisions keep working when a budget shrinks during a run, not only when a generator trips.
  sources:
  - brief p5, Constraints
  quote: keeps working when a budget shrinks or a data feed drops
  how: 'Every capacity is a function of conditions, recomputed each tick: power by gensets online, heat by seawater
    temperature (160 kW at 12 °C to 120 kW at 30 °C, x0.6 degraded), SATCOM by availability and emission state.
    The D4 ladder takes the tighter of power and cooling, so warming water or a degraded loop shrinks the target
    exactly like a trip. Planned demo evidence: replay Scenario B with seawater ramping past 27 °C and show the
    ladder''s first step.'
  links:
  - label: 'Core model: shedding ladder'
