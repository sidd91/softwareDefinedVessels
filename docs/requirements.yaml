- id: R-001
  category: deliverable
  called_out: true
  requirement: 'Headline: five deliverables due within 48 hours.'
  sources:
  - slides p14
  quote: '48 Hours: The Deliverables'
  how: 'The schedule ties deliverables to milestones (Scenario B on screen by M3 Sat 16:30, rules and CV by M4,
    docs and Physical Account by M5 Sun 01:00, freeze Sun 09:15), and the never-cut list protects ledger rationales,
    both scenarios, replay, link failover, Physical Account and Scenario C memo. The brief''s list differs slightly:
    runnable repo, schema with six cards, README of at most 3 pages, Physical Account, Scenario C memo PDF of at
    most 2 pages, live demo.'
