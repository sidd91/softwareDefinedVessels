- id: R-258
  category: framing
  called_out: true
  requirement: A Software Defined Vessel is one brain rather than three federated systems.
  sources:
  - brief p1, The challenge
  - slides p4
  quote: A Software Defined Vessel is one brain
  how: 'Locked thesis ''one ledger, one manifest language'' with four roles that set what the governor may do: host
    commitment (hotel 400 kW, safety systems, 20 % compute reserve, the governor itself: count, never shed), guest
    (admit, place, arbitrate, throttle, shed), supply (gensets, loop, bays, mast slots, links, compute nodes: track
    capacity, any loss is a degradation event), crew (hands and authority). Resource truth = the ledger computed
    from config/assumptions.yaml plus admitted cards. The decision record is proposed as the one output that screen,
    replay and demo read, but ARCHITECTURE open decision 2 still asks whether it is the single source of truth.
    Redundancy keeps one brain by replaying the same event log on the standby, not by syncing state.'
  links:
