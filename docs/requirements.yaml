  - slides p3
  quote: an engineer spends months working out whether there is enough power, cooling and deck space
  how: 'Mechanism: D1 admission answers slide p3''s study (enough power, cooling, deck space, what to switch off)
    by building one ledger line per resource class for the configuration with the new card, across the envelope
    grid (seawater 12 to 30 °C, two or one gensets), naming the binding line in one sentence and, for yes-if, ranking
    what to throttle or displace. Binding number: a 30 s ceiling against months of study. The data already reproduces
    the brief''s hand checks in tests/test_brief_arithmetic.py: all five guests 126.5 kW within 200 kW at cruise
    (test_all_five_fit_the_cruise_reserve); G5+G4+G3 105 kW against 100 kW with one genset down (test_one_genset_down_g5_g4_g3_charging_exceed_the_reserve);
    the chilled-water guests exceed the 72 kW a degraded loop rejects at 30 °C (test_all_five_do_not_fit_a_degraded_loop_in_30c_water);
    three of five sets of four exceed 10 t (test_three_of_five_sets_of_four_exceed_the_mass_margin, DEC-22). Missing:
    D1 itself and latency logging. Proof: DEMO_SCRIPT Scenario A verdict, one-genset-down check and seawater tipping
