    12 °C falling to 120 kW at 30 °C, minus 40 % when degraded (72 kW at 30 °C); at Scenario B''s 24 °C, 133 kW
    becomes 80 kW against 105 kW from G3 charging (25), G4 fast charge (35) and G5 (45); A.10 allows 14 days without
    a port call. Today: config/assumptions.yaml ship_state.cooling.repair_at_sea false and heat.degraded_factor
    0.6; test_cooling_capacity_matches_annex_a checks 72 kW. Missing: the state machine, any reader of repair_at_sea,
    a port-call event (ARCHITECTURE''s event types have cooling_degraded but nothing that restores it), and a test
    that no at-sea event restores nominal. Shown: DEMO_SCRIPT breadth strip camera line (C1, DEC-27), where a leak
