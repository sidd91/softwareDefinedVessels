  quote: otherwise the governor may only throttle or shed
  how: 'Mechanism: GAMEPLAN''s Core model limits what the governor does to guests: admit and place (in port, or
    an A.11 swap at sea), arbitrate, throttle, shed. Throttle means stepping down the mode ladder a card declares:
    G5 45 to 8 to 0 kW, G2 20 to 6 to 1 to 0, G4 35 to 10 to 2 to 0, G6 18 to 4 to 0. Shed means off. D4 throttles
    before it sheds, takes the cheapest mission loss per kW first, and never touches safety-critical guests. A.11''s
    logical reconfiguration at 0 crew (re-task, re-allocate compute, change priorities) counts as A.11, not as a
    third kind of action. Decisions may also issue ship-state requests (course, speed, noise, with A.6 transition
    times). The brief allows this: teams request states rather than control machinery (p6). Research rule R-E9-3:
    never command closures or damage-control equipment. Not built. Proof: DEMO_SCRIPT 00:42 (G5 to 8 kW, G2 to standby);
