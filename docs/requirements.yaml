- id: R-011
  category: deliverable
  called_out: true
  requirement: The memo must state the rule's trigger.
  sources:
  - brief p3, Scenario table, C (good handling)
  quote: its trigger and effect
  how: 'Mechanism: the memo''s Trigger section. R3 is on until G4 is secured, starting at launch when the lead exceeds
    12 min minus approach (6 and 0 aboard), else at min(recall, deadline minus approach minus lead) (14 aboard).
    Deadline is when G4 passed 20 % plus 12 min; lead is the longest confirm plus the longest clear (1 + 5 = 6 min
    at 14, 3 + 12 = 15 at 6, unbounded at 0 by our choice). Binding numbers: G4 reports 18 % at Scenario B min 8;
    at the assumed 1.11 % per min (r3.drain_pct_min) it passed 20 % 1.8 min earlier, leaving 10.2 min; less a 4
    min approach (r3.approach_min), 6.2 min against a 6 min lead: a 12 s margin. Planned: the RuleEngine evaluates
    it every 1 Hz tick; r3.* keys are not yet in data. Proof: memo Live demo step 1 and a proposed replay test that
    the window opens at the computed minute.'
  links:
  - label: 'Memo: trigger'
    path: docs/SCENARIO_C_MEMO.md#trigger
  - label: 'Memo: by crew level'
    path: docs/SCENARIO_C_MEMO.md#by-crew-level
  - label: A.6 times in data
