  - DEC-20
  - CON-10
  status: planned
  question: What is the thinnest slice of the executable we commit to running first (ledger plus D1 refusing one
    card with its sentence, the core of the brief's hour-4 checkpoint on p4), so every later engine plugs into a
    command that already works?
- id: R-003
  category: deliverable
  called_out: true
  requirement: 'Deliverable 2: a manifest schema.'
  sources:
  - slides p14
  quote: 'MANIFEST SCHEMA: The reusable standard for how a guest payload describes itself to the hull.'
  how: 'Mechanism: manifests/schema.json (JSON Schema 2020-12) is the standard every guest card must pass. It requires
    id, name, capability, cooling, placement, consumes, modes, installation and criticality, and also defines ship-state
    conditions, relations (part_of, requires, excludes) and hard_limits. Consumption per class is min, nominal,
    peak and peak_duration_s; each mode carries power_kw and capability_retained. ARCHITECTURE data contract 1 says
    adding a guest is adding one YAML file. Today six cards validate: G1 to G5 from Annex B (G4 hangar 0.85 t per
    the organizers'' correction) and our G6. Tests: test_every_card_validates_against_the_schema, test_six_cards_five_from_the_brief_plus_one_of_ours,
    test_g4_hangar_is_850_kg_after_the_correction. Missing: the documented way to add a card (R-060, a gap; the
    README has no such section), team review, and no engine reads the cards yet. Shown: DEMO_SCRIPT Scenario A step
    ''Card loaded, one number edited live'', where the edited card is re-validated.'
  links:
  - label: Schema
    path: manifests/schema.json
  - label: Example card (G4)
    path: manifests/G4.yaml
  - label: Validation tests
    path: tests/test_brief_arithmetic.py
  - label: Manifest contract
    path: docs/ARCHITECTURE.md#data-contracts
  - label: 'Demo: jury card'
    path: docs/DEMO_SCRIPT.md#scenario-a-jurys-card-deep
  decisions:
  - DEC-15
  - DEC-22
  status: drafted
  question: Should the add-a-card guide be a README section that walks G6 through the schema field by field, or
    a validate command that tells an unseen guest's author exactly which B.0 field is missing?
