  closing:
    battery_kw: 50
    a5_guests: [G1, G2, G4, G5]  # docs/EXPECTED_OUTCOMES.md, case A5
    text: >-
      **Closing question.** One change: a standby chilled-water pump, so losing a pump no longer costs 40 %
      of the loop (A.2), {{calc.pump_saves_30}} kW at 30 °C. Our minute-{{scenario_b.events.cooling_degraded.t_min}}
      pump fault then sheds nothing: at {{calc.sw_b}} °C the loop keeps {{calc.cool_b}} kW, not
      {{calc.cool_b_deg}}, so the {{calc.load_19}} kW load fits under {{calc.ceiling_b}} kW, not
      {{calc.ceiling_b_deg}}. At 30 °C a pump loss today leaves guests {{calc.gate_30_deg}} kW for up to
      {{envelope.days_without_port}} days with no repair at sea (A.6, A.10), against {{calc.chilled_b}} kW for our
      Scenario B set and {{calc.chilled_a5}} for A5; with the pump both fit under {{calc.gate_30}} kW. An exchanger
      fault still costs 40 %. A {{closing.battery_kw}} kW battery for a genset restart helps less: at 30 °C
      cooling caps it at {{calc.battery_usable_30}} kW.
