# Reference platform for the resource governor.
# Every number the code relies on lives here. `provenance` (bottom) tags each key as taken from
# the challenge brief or assumed by us, with the reason. The Physical Account is generated from
# this file, so an undocumented assumption cannot hide in code.

hull:
  loa_m: 60
  allowed_loa_m: [60, 70]

power:
  guest_reserve_kw: {cruise: 200, one_genset_down: 100}
  guest_reserve_kw_by_speed: {slow: 250, cruise: 200, fast: 150}
  envelope_reserve_kw: 200
  peak_extra_kw: {cruise: 250, one_genset_down: 100}
  peak_max_s: 60
  mission_line_kw: {port: 150, stbd: 150}
  line_lost_on_trip: none
  shed_headroom_kw: 5
  gensets: {count: 2, rating_kw: 450, load_limit: 0.9, restart_min: [5, 15]}
  hotel_kw: {range: [250, 400], committed: 400}
  ship_aux_kw: 55
  hotel_shed_on_trip_kw: 150
  trip_confirm: {signals: [relay_flag, kw_near_zero, frequency_dip], needed: 2}

heat:
  capacity_kw_at: {12: 160, 30: 120}
  degraded_factor: 0.6
  kw_heat_per_kw_electric: 1.0
  inertia: {extra_kw: 30, duration_s: 60, cooldown_s: 600}
  air_cooled_max_kw: 2
  degraded_confirm: plant alarm plus flow or delta-T, automatic
  chillers_on_essential_board: true
  degraded_means: one chilled-water pump of two

mass:
  margin_t: 10
  stability_budget_t_eq: 12
  multiplier: {bay: 1.0, flight_deck: 1.2, hangar_roof: 1.2, mast: 3.0}

data:
  backbone_mbps: 10000
  satcom_mbps: {min: 2, max: 8}
  satcom_availability: [0.70, 0.95]
  satcom_envelope_mbps: 2
  los_radio_mbps: {min: 1, max: 20}
  los_radio_operating_mbps: 20
  acoustic_kbps: {min: 1, max: 5}
  silent_zeroes: [satcom, los_radio]

compute:
  nodes: 4
  cores_per_node: 32
  ram_gb_per_node: 128
  accelerators_per_node: 1
  storage_tb: 20
  guest_share: 0.8

response_time_s:
  admission: 30
  placement: 30
  arbitration: 2
  shed_first_action: 5
  shed_full_sequence: 60
  safety_command: 0.2

# Discrete positions. Units: a 20-ft bay is two 10-ft halves; a whole-bay guest takes both.
positions:
  bay1: {kind: bay, size_ft: 20, halves: 2, max_t: 8, power_line: port, cooling: chilled_water, zone: bay}
  bay2: {kind: bay, size_ft: 10, halves: 1, max_t: 4, power_line: stbd, cooling: chilled_water, zone: bay}
  flight_deck: {kind: flight_deck, area_m: [12, 8], hangar_max_kg: 150, power_line: stbd, cooling: chilled_water, zone: flight_deck}
  stern_ramp: {kind: ramp, craft_len_m: [7, 9], max_t: 5}
  mast_free: {kind: mast, area_m2: 0.6, max_kg: 60, power_line: port, cooling: air, zone: mast}
  hangar_roof: {kind: roof, max_kg: 60, power_line: stbd, cooling: air, zone: hangar_roof}
  mast_occupied: [navigation radar, satellite terminal]

envelope:
  seawater_c: [12, 30]
  judge_cooling_at_c: 30
  speed_bands: [slow, cruise]
  sea_state_max: 5
  wind_kn_max: 30
  genset_down_possible: true
  days_without_port: 14

ship_state:
  course: {values: [free, steady], settle_min: [1, 3]}
  speed_band: {values: [stopped, slow, cruise, fast], kn: {stopped: 0, slow: [3, 5], cruise: [10, 14], fast: 18}, min_per_band: [2, 5]}
  noise: {values: [quiet, normal, manoeuvring], to_quiet_min: [2, 4], leave_quiet_min: 0}
  deck: {values: [clear, occupied], clear_min: {14: [3, 5], 6: [8, 12], 0: null}}
  emission:
    values: [normal, silent]
    to_silent_min: 0
    silent_forbids: [radio_transmit, satcom_transmit, machinery_above_minimum, manoeuvre, deck_machinery]
    silent_allows: [receiving, computing, passive_sensing]
  genset: {values: [2, 1], trip_s: 0, restart_min: [5, 15]}
  cooling: {values: [nominal, degraded], repair_at_sea: false}

crew:
  levels: [14, 6, 0]
  confirm_s: {14: [15, 60], 6: [60, 180], 0: null}

installation:
  in_port: {crane_t: 8, hours_per_bay_guest: [4, 8], hours_per_mast_guest: [2, 4], hours_per_drone_or_vehicle: 1}
  at_sea_crewed:
    max_kg: 250
    via: [flight_deck, stern_ramp]
    window: {sea_state_max: 3, wind_kn_max: 20, speed_kn: [4, 8], course: steady, deck: clear, survey_vehicle_listening: false}
    people: {flight_deck: 3, stern_ramp: 4}
    minutes: {drone_swap: 30, vehicle_swap: 45}
  at_sea_uncrewed: logical_only

rules:
  r3:
    approach_min: 4
    drain_pct_min: 1.11
    stale_s: {camera: 3, g4_telemetry: 10}
    change_threshold: to_calibrate
    zone: marked landing area, flying-stations positions masked, drone secured with no deck hand
    override: landing officer only, at 14 and 6 aboard, logged, valid for one landing, cancelled by a new detection
    camera: fixed flight-deck camera, inference in the 20 % ship-systems compute reserve, never shed
    uncrewed_launch: needs automatic landing and securing, fixed deck firefighting and a lit or low-light deck view for the 90 min sortie
    unchanged: all deck markers visible and the frame matches the last crew sweep

admission:
  seawater_scan_step_c: 0.1
  seawater_scan_max_c: 35

provenance:
  heat.degraded_confirm: {source: assumed, short: "a camera alone never confirms a cooling fault", why: "Scenario B (DEC-40): a cooling fault counts as confirmed only on the plant alarm plus flow or delta-T, automatically; camera evidence alone only precomputes the plan."}
  heat.chillers_on_essential_board: {source: assumed, short: "chillers survive the hotel shed on a trip", why: "Chillers and chilled-water pumps sit on the essential board inside the 55 kW ship auxiliaries, so the 150 kW non-essential hotel shed on a genset trip does not take cooling with it."}
  heat.degraded_means: {source: assumed, short: "degraded = one pump of two", why: "The brief's -40 % degraded loop (A.2) is read as one of two chilled-water pumps lost."}
  rules.r3.approach_min: {source: assumed, short: "final approach only; transit overlaps deck clearing", why: "Scenario C rule R3: final approach and landing from the loiter point; G4's own estimate is used if longer. Transit from range runs alongside deck clearing."}
  rules.r3.drain_pct_min: {source: assumed, short: "100 % over 90 min, never slower; unverified", why: "R3: 100 % over the 90 min endurance (brief B, G4); we assume G4 never drains slower, which dates the 20 % crossing conservatively. Unverified."}
  rules.r3.stale_s: {source: assumed, short: "older readings count as unknown", why: "R3: a camera frame older than 3 s or drone telemetry older than 10 s counts as unknown."}
  rules.r3.change_threshold: {source: assumed, short: "false alarm holds, miss risks the drone; calibrate", why: "R3: how much of a deck marker or zone must change to count as not clear. A false alarm costs a hold, a miss a damaged drone. To be calibrated on the demo webcam."}
  rules.r3.zone: {source: assumed, short: "fire party clear; drone secured with no deck hand", why: "R3 guards the marked landing area; the fire party and landing officer stand near but clear of it, which assumes the drone is secured with no deck hand (research E3 puts deck crew on deck for helicopters)."}
  rules.r3.override: {source: assumed, short: "an authority act; impossible at 0 aboard", why: "R3: an override is an authority act, not a sensor reading; impossible at 0 aboard (brief A.6)."}
  rules.r3.camera: {source: assumed, short: "ship supply, in the 20 % compute reserve", why: "R3: the deck camera is ship supply, so its inference sits in the ship-systems compute reserve (brief A.7) and is never shed."}
  rules.r3.uncrewed_launch: {source: assumed, short: "nobody can clear the deck at 0 aboard", why: "R3 at 0 aboard: nobody can clear the deck (brief A.6), so a launch is refused unless recovery stays possible for the whole sortie. Fixed deck firefighting availability is unconfirmed."}
  rules.r3.unchanged: {source: assumed, short: "evidence the deck stayed clear since the sweep", why: "R3 at 0 aboard: the evidence that the deck is still clear since the last crew sweep."}
  hull.loa_m: {source: assumed, short: "slides show 60 m; brief allows 60-70 m", why: "The slides show a 60 m vessel (reference drawing and demo baseline); the brief allows 60-70 m. We use 60 m. The roll model in research/sensors/navigation_environment.md, built at 65 m, was re-checked at 60 m: roll period 9.75 s against 9.70 s, no material change."}
  hull.allowed_loa_m: {source: brief A intro}
  power.guest_reserve_kw_by_speed: {source: assumed, short: "less propulsion load at slow speed", why: "The brief says the reserve is a function of speed and gives 200 kW nominal at cruise within 150-250 kW. Less propulsion load at slow speed leaves more for guests, so slow takes the top of the range and fast the bottom."}
  power.envelope_reserve_kw: {source: assumed, short: "lower of the slow and cruise bands", why: "The envelope covers the slow and cruise bands, so admission uses the lower of their reserves: 200 kW."}
  ship_state.emission: {source: brief A.6}
  power.guest_reserve_kw: {source: brief A.1}
  power.peak_extra_kw: {source: brief A.1, A.9}
  power.peak_max_s: {source: brief A.1}
  power.mission_line_kw: {source: brief A.1}
  power.line_lost_on_trip: {source: assumed, short: "brief lets us choose; the total then binds", why: "The brief lets us choose. Both lines survive a trip, so the reduced total reserve, not a single line, binds."}
  power.shed_headroom_kw: {source: assumed, short: "a load swing must not re-trigger shedding", why: "Kept free after shedding so a normal load swing does not re-trigger the sequence."}
  power.gensets.load_limit: {source: assumed, short: "usual practice; closes to the 200 kW reserve", why: "Common practice is to load gensets to about 90 % of rating; with it, two 450 kW sets close against the brief's 200 kW guest reserve."}
  power.hotel_kw.committed: {source: assumed, short: "top of the brief's 250-400 kW range", why: "Upper end of the brief's 250-400 kW hotel range, the conservative choice."}
  power.ship_aux_kw: {source: assumed, short: "balances 810 kW down to the 200 kW reserve", why: "Ship auxiliaries outside hotel load; chosen so 810 kW minus 400 hotel minus 55 leaves the brief's 200 kW guest reserve with 155 kW spare."}
  power.hotel_shed_on_trip_kw: {source: assumed, short: "leaves the brief's 100 kW on one set", why: "Non-essential hotel load the PMS drops on a trip, so one 405 kW set leaves the brief's 100 kW for guests."}
  power.trip_confirm: {source: assumed, short: "one bad sensor must not shed (Viking Sky)", why: "A single sensor must not trigger a shed; 2 of 3 independent signals confirm a trip (Viking Sky lesson)."}
  heat: {source: brief A.2}
  mass: {source: brief A.4}
  data.satcom_envelope_mbps: {source: assumed, short: "low end of the brief's 2-8 Mbit/s", why: "Admission is judged at the low end of the brief's 2-8 Mbit/s SATCOM range."}
  data.los_radio_operating_mbps: {source: assumed, short: "top rate inside the operating range", why: "Within the drone's 5-20 km operating range the line-of-sight radio delivers its top rate; range loss is handled at run time, not at admission."}
  data: {source: brief A.5}
  compute: {source: brief A.7}
  response_time_s: {source: brief A.8}
  positions.bay1: {source: brief A.3}
  positions.bay2: {source: brief A.3}
  positions.flight_deck: {source: brief A.3}
  positions.stern_ramp: {source: brief A.3}
  positions.mast_free: {source: brief A.3}
  positions.bay1.power_line: {source: assumed, short: "one connection per bay; split the lines", why: "One connection per bay; Bay 1 on the port line."}
  positions.bay2.power_line: {source: assumed, short: "Bay 2 never shares a line with Bay 1", why: "Bay 2 on the starboard line, so the two bays never share a line."}
  positions.flight_deck.power_line: {source: assumed, short: "drone charge plus a Bay 2 guest under 150 kW", why: "Flight deck on starboard; drone charging and a Bay 2 guest together stay under 150 kW."}
  positions.mast_free.power_line: {source: assumed, short: "the lighter-loaded line", why: "Mast on port, the lighter-loaded line."}
  positions.hangar_roof: {source: assumed, short: "small antenna clears drone ops; 60 kg like the mast", why: "The brief allows G5's antenna on the hangar roof (x1.2, check drone clearance); we assume a 0.3 m2 antenna clears drone operations and limit the roof to 60 kg like the mast."}
  envelope: {source: brief A.10}
  ship_state: {source: brief A.6}
  crew: {source: brief A.6}
  installation: {source: brief A.11}
  admission.seawater_scan_step_c: {source: assumed, short: "resolution of the reported tipping point", why: "Resolution for reporting the seawater temperature at which a verdict flips."}
  admission.seawater_scan_max_c: {source: assumed, short: "covers the 30.4 °C Florida stress case", why: "Scan a little past the 30 °C design point to show the stress case off Florida (30.4 °C)."}
