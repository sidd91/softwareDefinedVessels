# New values in this file that belong in config/assumptions.yaml with provenance once the agents editing it
# are done (DEC row needed). Until then they are proposals, not Physical Account rows.
pending_moves:
  - confirm_rules.genset_trip thresholds (22.5 kW, 58.8 Hz, a 60 Hz bus) and fault_signatures (59.6 Hz, 50 % flow, +9 C)
