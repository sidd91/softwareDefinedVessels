     fallback: {rule: "derivations.g4_land_by.stale_rule"}, read_by: [D3, record], provenance: "derivations.g4_land_by; tests/oracles crossed_threshold_at_min 6.2"}
  - {name: G4.land_by_t_s, group: guests, kind: derived, type: ship_time, nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G4.airborne_since_t_s, G4.battery_crossing_t_s],
     fallback: {rule: "never moves later"}, read_by: [D3, D5, safety, record], provenance: "derivations.g4_land_by; tests/oracles deadline_min 18.2"}
