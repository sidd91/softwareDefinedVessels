  - {name: G6.mode, group: guests, kind: guest, type: enum, values: [production, recirculate, "off"], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's highest-draw mode"}, read_by: [ledger, D4], provenance: manifests/G6.yaml modes}
  - {name: G6.activity, group: guests, kind: guest, type: enum, values: [none, production, start], producer: simulator, source: guest_report, feed: guest_backbone, rate: 1 Hz, fallback: {rule: "the last value"}, read_by: [D3], provenance: activities.G6}
