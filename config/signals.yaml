  - {name: G2.overdraw_pct, group: guests, kind: derived, type: number, unit: "%", range: [-100, 1000], nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G2.kw_actual, G2.mode], fallback: {value: null}, read_by: [ledger, D4, record], provenance: derivations.overdraw}
  - {name: G2.mode_ends_t_s, group: guests, kind: derived, type: ship_time, nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G2.mode], fallback: {rule: "keeps the last value"}, read_by: [ledger, D4], provenance: "manifests/G2.yaml winch duration_s 300; derivations.mode_ends"}
  - {name: G3.mode, group: guests, kind: guest, type: enum, values: [charging, standby, "off"], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's highest-draw mode"}, read_by: [ledger, D4], provenance: manifests/G3.yaml modes}
  - {name: G3.activity, group: guests, kind: guest, type: enum, values: [none, surveying, launch_recovery, holding_depth, holding_at_sea, on_cradle], producer: simulator, source: guest_report, feed: g3_acoustic, rate: event,
     fallback: {rule: "the last reported activity, kept and substituted; surveying only if the last report was surveying"}, read_by: [D3, D1, safety, window],
     provenance: "activities.G3; feeds.g3_acoustic (stale only while the link is up)"}
  - {name: G3.kw_actual, group: guests, kind: guest, type: number, unit: kW, range: [0, 50], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's declared peak, or nominal without one"}, read_by: [ledger], provenance: "brief synthetic feeds; metered at the cradle"}
  - {name: G3.data_demand, group: guests, kind: guest, type: rates, producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's nominal rates"}, read_by: [ledger], provenance: manifests/G3.yaml consumes}
  - {name: G3.overdraw_pct, group: guests, kind: derived, type: number, unit: "%", range: [-100, 1000], nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G3.kw_actual, G3.mode], fallback: {value: null}, read_by: [ledger, D4, record], provenance: derivations.overdraw}
  - {name: G3.mode_ends_t_s, group: guests, kind: derived, type: ship_time, nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G3.mode], fallback: {rule: "keeps the last value"}, read_by: [ledger, D4], provenance: "manifests/G3.yaml charging duration_s 3600, not interruptible"}
  - {name: G3.leg_state, group: guests, kind: guest, type: enum, values: [none, running, paused, aborted, done], producer: simulator, source: guest_report, feed: g3_acoustic, rate: event,
     fallback: {rule: "the last reported state, kept and substituted"}, read_by: [D3, record], provenance: "tests/oracles minute_8 g3.leg paused or aborted"}
  - {name: G3.leg_started_t_s, group: guests, kind: guest, type: ship_time, nullable: true, producer: simulator, source: guest_report, feed: g3_acoustic, rate: event,
     fallback: {rule: "keeps the last value"}, read_by: [D3], provenance: "brief Scenario B (40 min leg, derivations.g3_leg)"}
