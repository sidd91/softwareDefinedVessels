  - {name: G4.launched_t_s, group: guests, kind: guest, type: ship_time, nullable: true, producer: simulator, source: guest_report, feed: g4_telemetry, rate: event,
     fallback: {rule: "keeps the last value"}, read_by: [D3, D5], provenance: "Annex B G4 endurance 90 min; sent at tick 0 (a sortie under way before the timeline starts) and on each launch"}
