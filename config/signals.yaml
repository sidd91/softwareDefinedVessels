# ArgOS signal vocabulary: every input to state estimation, and every value the estimator derives.
# Status: proposal, Sat 2026-10-17, written by Claude Opus 5.5 on behalf of Logan Walker (GhostWalka), who owns
# the inputs (everything that goes into state estimation). Nothing here is decided until a WORKLOG DEC- row
# says so. This file is the only authority for signal names, types, feeds, fallbacks and derivations. Read it
# with docs/STATE_ESTIMATION.md. tools/gen_snapshot_schema.py turns it into config/snapshot.schema.json (what
# the estimator emits) and config/frame.schema.json (what the simulator hands the estimator);
# tools/build_snapshot_fixtures.py builds tests/fixtures/; tests/test_snapshot_contract.py checks all of them.
#
# One entry per signal. Fields:
#   name        the key. Guest signals are "Gx.key" and sit under guests.Gx.key.
#   group       the snapshot group: plant, ship_state, environment, links, crew, guests, capacity.
#   kind        plant, ship_state, guest, crew, link, environment or derived.
#   type        enum (values), number (unit, range), integer (unit and range, or values), boolean,
#               ship_time (seconds of ship time), capacity (capacity, unit, degraded_by, zero_by_rule),
#               rates (data demand per link), requests (bridge confirmation requests), sweep (the last crew sweep).
#   nullable    true when null is a legal value: no reading yet, or a value that does not apply. null fails
#               every numeric comparison in D1 and D3.
#   producer    simulator (Siddharth emits it in the frame), laptop (a demo input; the core passes it to the
#               simulator, which emits it in the frame), or estimator (Logan's core derives it).
#   source      the field's `source` (one value, or the list it may take).
#   feed        the feed a non-derived signal arrives on (feeds below). A feed_drop event names one feed.
#   rate        1 Hz (present in every frame), event (present only in the frame its report arrives), hourly,
#               or per tick (derived).
#   grace_s     two-stage fallback: hold the last value (substituted) this long, then the fallback.
#   fallback    what the estimator uses once the signal is stale: a value, a rule, or by_use.
#   inputs      derived only: the snapshot fields it is computed from. Its confidence follows from them.
#   read_by     ledger, D1, D2, D3, D4, D5, safety, link (the acoustic rule), window (A.11), record (sentence).
#   provenance  a brief section, a repo key, or "assumed: reason". Assumed values are listed in pending_moves.

version: 2
clock: ship time                  # every rate, age, limit, debounce and deadline below is in ship seconds
default_stale_after_s: 3          # config/assumptions.yaml stale_feed.after_s: three 1 Hz ticks
rounding: 0.1                     # every float in a snapshot, frame or record is rounded to 0.1 (kW, s, kn, C, Hz, %)

field_metadata:
  source: [plant, guest_report, crew_report, laptop, public_data, scenario, derived]
  # Weakest first.
  confidence: [substituted, assumed, reported, measured, confirmed]
  confidence_rule:
    raw: "stale: substituted. Otherwise by source: plant measured; guest_report, crew_report, laptop and public_data reported; scenario assumed. A signal with no reading yet (value null, age_s null) is assumed."
    derived: "substituted if any input is substituted. A confirm-rule output (confirm: <rule>) is confirmed while a fault of that rule is confirmed or restoring. Otherwise the weakest of its inputs; with no snapshot inputs (config only), assumed."
    age: "a raw field's age_s is ship time now minus its reading time t_s. A derived field is computed this tick: age_s 0, stale only when its confidence is substituted."

# ------------------------------------------------------------------------------------------------ feeds
# A feed is a group of signals that arrive together and drop together. A 1 Hz signal is stale when its own
# age is above the feed's stale_after_s. An event-rate signal keeps its report age but is stale only when its
# feed is (the heartbeat, or the rule, says the feed has gone quiet), so an old report on a healthy feed is not
# a stale feed.
feeds:
  pms: {stale_after_s: 3, what: "power management: genset relay flags, genset kW, bus frequency"}
  chw: {stale_after_s: 3, what: "chilled-water plant: pumps running and alarm, flow, supply and return"}
  nav: {stale_after_s: 3, what: "course, speed in knots, noise, situation"}
  deck: {stale_after_s: 3, what: "deck zones, ramp, deck machinery, deck activity since the last sweep"}
  emission: {stale_after_s: 3, what: "emission state and the ship's own radar"}
  anemometer: {stale_after_s: 3, what: "the ship's wind speed and direction"}
  comms: {stale_after_s: 3, what: "SATCOM and line-of-sight radio rates"}
  public_data: {stale_after_s: 10800, what: "hourly seawater temperature and sea state (scenario value in Scenario B)"}
  laptop: {stale_after_s: 3, what: "crew inputs, re-emitted every tick; each answer keeps its own reported_t_s"}
  guest_meter: {stale_after_s: 3, what: "each guest's connection on the ship: mode in effect, metered kW, data demand"}
  guest_backbone: {stale_after_s: 3, what: "activity reports of the guests on the backbone (G1, G2, G5, G6)"}
  g4_telemetry: {stale_after_s: 10, heartbeat: G4.activity, what: "G4 over line-of-sight radio, or the hangar link once landed: activity and range at 1 Hz (the heartbeat), battery and launch time on report",
                 provenance: "config/assumptions.yaml rules.r3.stale_s.g4_telemetry (10 s)"}
  g3_acoustic: {stale_after_link_up_s: 120, what: "G3's acoustic messages: activity, leg, hold acknowledgement",
                rule: "stale only while acoustic_link_up is true: stale once the link has been up for more than stale_after_link_up_s with no G3 message (time since the later of the last message and the link coming up). While the link is down by design G3 is out of contact, not stale.",
                provenance: "assumed: 2 x data.acoustic_link.judged_latency_s (60 s); a vehicle on a working link answers inside one round trip"}

fallback_policy:
  lift_after_fresh_frames: 3      # a fallback lifts only after 3 consecutive fresh frames of its feed, so a flapping feed does not flip D1 limits each tick
  grace_s: 30                     # the hold stage of the two-stage fallback (signals with grace_s)
  stages: "hold: the last value, substituted, for grace_s; bound: the fallback value; crew_report: a fresh report from the landing officer replaces a stale wind or deck value"
  hard_limit: "Unknown never means safe: a closure from a fallback stands, even against a hard limit. While a G4 hard limit is active (battery below 20 %) and someone is aboard, D5 asks the landing officer for wind and deck; a fresh hlo_wind_kn or hlo_deck_report replaces the stale value (source crew_report, stage crew_report) and the record names the substitution. At 0 aboard there is no report, the closure stands and the record states the cost to G4."
  d4: "D4 never acts on a substituted value. It acts on confirmed faults and on over-commitment the ledger computes only from fresh, non-substituted inputs. A fallback may tighten admission (D1) and arm the D4 ladder."
  by_use: "a by_use fallback keeps the last good value as the field value; each consumer applies its own entry from substituted.rule"
  provenance: "config/assumptions.yaml stale_feed; research/SENSOR_CATALOG.md rule 4; assumed: the 3-frame lift and the 30 s grace"

# ------------------------------------------------------------------------------------------------ faults
# The estimator confirms faults from raw votes. raw_event_t_s is the first tick on which any vote for that
# subject is true. confirmed_t_s is the first tick t on which the vote count meets the rule on every tick of
# [t - hold_s, t]. A vote that drops sooner cancels the pending fault (logged). A pending fault whose votes go
# stale is held (state held_stale), not cancelled; it confirms if the feed returns showing it still true.
# Meanwhile the ladder stays armed and the record says the fault is unconfirmed because the feed is stale.
confirm_rules:
  genset_trip:
    votes: {relay_trip: "genset_N_relay_trip is true", kw_near_zero: "genset_N_kw below 22.5 kW", frequency_dip: "bus_frequency_hz below 58.8 Hz"}
    needed: 2                     # power.trip_confirm.needed
    hold_s: 1                     # fault_entry.debounce_s
    provenance: "assumed: kW near zero is below 5 % of the 450 kW rating; a dip is more than 2 % below a 60 Hz bus. The brief gives neither threshold, nor the bus frequency."
  cooling_degraded:
    needs_any: {pump_alarm: "chw_pump_N_alarm is true", pump_stopped: "chw_pump_N_running is false (both pumps run in normal service)"}
    plus_any: {flow_low: "chw_flow_pct below 70", delta_t_high: "chw_return_c minus chw_supply_c above 8 C"}
    hold_s: 1
    provenance: "config/assumptions.yaml heat.degraded_confirm (alarm plus flow or delta-T); assumed: a pump stopped with no alarm also counts (A.2 'pump or exchanger down'); the exchanger is not modelled; one of two pumps lost leaves about half the flow; a nominal delta-T is about 5 C (7 C supply, 12 C return)"
  restore:
    healthy_hold_s: 60            # fault_entry.restore_hold_s
    provenance: config/assumptions.yaml fault_entry.restore_hold_s
  deadlines:
    first_shed_due: "raw_event_t_s + response_time_s.shed_first_action (5 s), checked in ship time: the tick the first shed command is applied (confirmed_t_s + 1) must not be later"
    full_sequence_due: "raw_event_t_s + response_time_s.shed_full_sequence (60 s)"

# What the simulator emits so that the estimator confirms a timeline fault at the oracle's tick. Siddharth
# owns the signatures; these are the drafts both sides build against until a DEC row settles them.
fault_signatures:
  genset_trip:
    from_tick: "the event tick t (ceil(60 x t_min))"
    signals: {genset_N_relay_trip: true, genset_N_kw: 0, bus_frequency_hz: 59.6, other_genset_kw: "its share of the whole load"}
    held: until genset_restart
    confirms_at: "t + 1 on relay_trip and kw_near_zero (59.6 Hz casts no frequency vote)"
  genset_restart:
    signals: {genset_N_relay_trip: false, genset_N_kw: "back to its share of the load", bus_frequency_hz: 60.0}
    transition: "gensets_online carries {to: 2, started_t_s, expected_end_t_s} from the restart event (power.gensets.restart_min, 5 to 15 min); healthy for restore.healthy_hold_s before any guest is restored"
  cooling_degraded:
    from_tick: "the event tick t (Scenario B: 2 min after G4 lands, triggered)"
    signals: {chw_pump_P_alarm: true, chw_pump_P_running: false, chw_flow_pct: 50, chw_return_c: "chw_supply_c + 9"}
    held: for the rest of the run (no repair at sea, A.6)
    confirms_at: "t + 1 on pump_alarm, pump_stopped, flow_low and delta_t_high"
  false_alarm:
    rule: "an event with confirmed: false emits one vote (relay flag or pump alarm) for one tick only; the estimator cancels it and logs the cancellation"

# ------------------------------------------------------------------------------------------------ derivations
derivations:
  speed_band:
    bands_kn: {stopped: [0, 0.5], slow: [3, 5], cruise: [10, 14], fast: [18, null]}
    rule: "the band whose range holds speed_kn (bounds inclusive); in a gap, the faster neighbour. Display only: the guest reserve reads speed_kn, never this label."
    provenance: "brief A.6 (stopped, slow 3-5, cruise 10-14, fast 18+); assumed: stopped below 0.5 kn"
  guest_reserve_kw:
    rule: "with two gensets: inside an A.6 band, that band's reserve; in a gap, the lower reserve of its two neighbours (0.5-3 kn 200, 5-10 kn 200, 14-18 kn 150). With one genset: power.guest_reserve_kw.one_genset_down (100)."
    stopped_kw: 200
    provenance: "config/assumptions.yaml power.guest_reserve_kw_by_speed; assumed: stopped has no entry, so it takes the cruise 200 kW (A.1's nominal) rather than credit slow's 250. A gap never loosens the budget."
  speed_tolerance_kn: {value: 0.5, provenance: "assumed: a card condition on one speed (G3 'speed_kn: 3') holds within 0.5 kn of a noisy reading"}
  heat_capacity:
    rule: "160 kW at 12 C falling linearly to 120 kW at 30 C (160 below 12 C), times 0.6 while cooling_state is degraded"
    provenance: brief A.2 (config/assumptions.yaml heat.capacity_kw_at, heat.degraded_factor)
  shed_ceiling_kw:
    rule: "min(power capacity, heat capacity) minus power.shed_headroom_kw"
    provenance: config/assumptions.yaml power.shed_headroom_kw; tests/oracles minute_12 and minute_19
  links:
    rule: "satcom and los_radio capacity: the live rate, 0 in silence (zero_by_rule). The radio to G4 is 1 Mbit/s while G4.range_km is null or beyond 20 km. acoustic: acoustic_kbps, 0 while the link is down (zero_by_rule)."
    provenance: "brief A.5; config/assumptions.yaml data.silent_zeroes, data.los_radio_drone_range_km_max"
  acoustic_link_up:
    rule: "every condition in config/assumptions.yaml data.acoustic_link.up_when holds (course steady, noise quiet, deck_machinery false) and the run constant layered_water is false; drop delay 0 s"
    provenance: brief A.5; config/assumptions.yaml data.acoustic_link
  acoustic_kbps: {value_up: 3, provenance: "assumed: 3 kbit/s while the link is up (inside A.5's 1-5), 0 while down"}
  effects:
    rule: "for ramp, deck_machinery, heading_free and flight_deck_ops the snapshot field carries by: the guests whose running activity has that effect. deck_machinery is true if the simulator reads true OR a running activity has effect deck_machinery true; ramp is in_use if either says so (the worse of the two). The simulator must set them itself (deck_machinery while G2.winch or G4.launch_recovery runs, ramp during G3.launch_recovery); a mismatch is logged. heading_free is false while a running activity pins it; flight_deck_ops is in_use while one uses the flight deck."
    self_exclusion: "a guest's own conditions are evaluated against the state less its own effects: where by holds only that guest, the field reads its idle value"
    idle: {ramp: free, deck_machinery: false, heading_free: true, flight_deck_ops: free}
  deck_machinery_permitted:
    rule: "emission normal and no running activity lists deck_machinery in its excludes"
    provenance: "brief A.6 (silence forbids deck machinery); G2 card note (excluded while G3 listens or G4 recovers)"
  deck_latched_clear:
    rule: "true iff last_sweep.result is clear and deck_activity_since_sweep is false (the simulator does not count G4's own launch, rules.r3.latched_deck)"
    provenance: config/assumptions.yaml rules.r3.latched_deck, rules.r3.deck_evidence
  g4_land_by:
    rule: "while G4 is airborne or in launch_recovery: the earlier of (launched_t_s + 90 min endurance) and (battery crossing + 12 min); null once landed. A report below 20 % dates the crossing back at the slowest drain: crossing = t_report - (20 - pct) / drain_pct_min x 60. A fresh report at or above 20 % sets no battery deadline. The deadline may move earlier, never later."
    stale_rule: "while the g4_telemetry feed is stale and the last report is at or above 20 %: crossing = t_report + (pct - 20) / drain_pct_max x 60, the earliest crossing the report allows; land_by = min(current, crossing + 12 min)"
    drain_pct_max: 1.5
    provenance: "brief Annex B G4 (20 %, 12 min, 90 min); config/assumptions.yaml rules.r3.drain_pct_min; assumed: drain_pct_max 1.5 %/min, a headwind sortie at 22 kn; docs/EXPECTED_OUTCOMES.md minute 8 (18.2)"
  mode_ends:
    rule: "the mode's start plus the card's duration_s; null for a mode without one"
    provenance: manifests (duration_s)
  overdraw:
    rule: "overdraw_pct = (kw_actual / declared kW of the current mode - 1) x 100 while kw_actual is fresh; null when declared is 0 or kw_actual is not fresh. Over-consumption is detected when it stays above threshold_pct for hold_s; the event guest_overconsumption is raised and the ledger counts kw_actual."
    threshold_pct: 5
    hold_s: 10
    provenance: "brief State (a guest over-consumes 10-20 %); DEMO_SCRIPT (G5 15 % over); assumed: 5 % for 10 s, above meter noise and inside the brief's 10-20 % (R-082 tolerance)"
  g3_leg:
    leg_length_s: 2400
    recovery_window_s: 900
    provenance: "brief Scenario B (40 min leg); assumed: the 15 min minimum recovery window behind survey_minutes_lost 25 to 27 (EXPECTED_OUTCOMES minute 8: 8 flown + 15 paused + 2 to 4 to settle)"

# The ledger is not the snapshot. These rules are listed here because they read snapshot fields; the ledger
# owns them (ARCHITECTURE contract 8). The snapshot carries capacity only; committed and free are ledger lines.
ledger_rules:
  committed: "per guest, the larger of the declared kW of its current mode, the kW the core reserves for it (from the decision log: {Gx: {mode, kw, since_t_s}}), and kw_actual while fresh; summed over the guests that draw on the class (power: all; a line: the guests placed on it; heat: chilled-water guests)"
  free: "capacity minus committed"
  buffered: "while a link's capacity is 0 by rule (zero_by_rule: acoustic down, silence), each guest's demand on it is buffered: committed 0, buffered {Gx: rate}, free 0, and no normalised margin is computed"
  static_classes: "backbone, compute cores, mass, bay units, high slots, flight deck and stability capacities come from config/assumptions.yaml and the placement; they are not in the snapshot"
  provenance: "docs/ARCHITECTURE.md contract 8; DEC-40 (sar reserves G4's 35 kW); R-082 (actual against declared)"

# Values that are stated once per scenario, not read from the ship.
run_constants:
  layered_water: {type: boolean, source: scenario, from: config/scenarios/*.yaml location.layered, read_by: [link],
                  provenance: "config/assumptions.yaml data.acoustic_link.layered_water (not modelled; each scenario states its water column)"}

# ------------------------------------------------------------------------------------------------ activities
# Activities each guest may report, qualified as Gx.activity. card: true means the card's conditions name it.
# modes: the card modes it runs in. effects: what it does to the four effect fields (derivations.effects).
# excludes: what it forbids others to run. "none" is always allowed.
activities:
  G1:
    listening: {card: true, modes: [full], effects: {}, excludes: [], provenance: "manifests/G1.yaml; not the 'listening' of G3 (see G3.surveying)"}
  G2:
    probe: {card: true, modes: [sampling], effects: {}, excludes: [], provenance: "manifests/G2.yaml; the sampling mode by the oracle's convention (expected_outcomes probe_paused)"}
    winch: {card: true, modes: [winch], effects: {deck_machinery: true}, excludes: [], provenance: "manifests/G2.yaml; a winch is deck machinery (brief A.6)"}
  G3:
    surveying: {card: true, modes: [standby], effects: {heading_free: false}, excludes: [deck_machinery], provenance: "manifests/G3.yaml; the cable route pins the heading and machinery breaks the link. Also called 'listening' in G2's note and survey_vehicle_listening in installation.at_sea_crewed.window"}
    launch_recovery: {card: true, modes: [standby], effects: {ramp: in_use}, excludes: [], provenance: "manifests/G3.yaml; over the stern ramp (A.3). G4's stern_ramp_ops means this"}
    holding_depth: {card: false, modes: [standby], effects: {}, excludes: [], provenance: "assumed: the safety command 'G3 hold depth' (assumptions safety_commands) and the survey oracle g3.holds depth"}
    holding_at_sea: {card: false, modes: [standby], effects: {}, excludes: [], provenance: "assumed: the sar oracle g3.holds at_sea, the leg aborted"}
    on_cradle: {card: false, modes: [charging, standby, "off"], effects: {}, excludes: [], provenance: "assumed: the vehicle aboard in Bay 1, where it charges (G3 card, charging after each leg)"}
  G4:
    launch_recovery: {card: true, modes: [standby], effects: {flight_deck_ops: in_use, deck_machinery: true, heading_free: false}, excludes: [deck_machinery], provenance: "manifests/G4.yaml; hangar doors are deck machinery (A.6) and the ship turns into the wind; G2's note excludes the winch while G4 recovers. G2 and G3 call it G4.recovering"}
    airborne: {card: false, modes: [standby], effects: {}, excludes: [], provenance: "manifests/G4.yaml hard limit 'airborne'; Scenario B G4 airborne at 2 kW (DEC-40)"}
    landed: {card: false, modes: [fast_charge, charge, standby, "off"], effects: {}, excludes: [], provenance: "assumed: config/scenarios/scenario_b.yaml guest_state landed_fast_charging, split into activity landed and mode fast_charge"}
  G5:
    transmitting: {card: true, modes: [full, low_power], effects: {}, excludes: [], provenance: manifests/G5.yaml}
  G6:
    production: {card: true, modes: [production], effects: {}, excludes: [], provenance: "manifests/G6.yaml; the pump keeps noise at normal or above, which the simulator's noise reading carries; D3 meets it through G3.surveying's noise: quiet"}
    start: {card: true, modes: ["off"], transition: {from: "off", to: production}, effects: {}, excludes: [], provenance: "manifests/G6.yaml; a transition from off to production, needing two people"}

# ------------------------------------------------------------------------------------------------ events
# Every event the simulator applies and echoes in the frame, and the estimator copies into the snapshot of the
# tick it is applied at (ARCHITECTURE contract 6, plus the inputs this contract adds). An event at t_min m is
# applied at tick ceil(60 x m); a triggered event fires on the first tick its trigger plus delay is met.
# Payload types: string, guest (G1 to G6), feed (a feeds key), number, number? (or null), integer, boolean,
# object, any, or a list of allowed values. Keys in optional may be left out.
events:
  baseline: {payload: {note: string, assumed: object}, optional: [assumed], provenance: "contract 6; the starting state the scenario does not state"}
  card_presented: {payload: {guest: guest, card: string}, provenance: contract 6}
  card_edited: {payload: {guest: guest, field: string, from: any, to: any}, provenance: contract 6}
  priority_swap: {payload: {mission: string}, provenance: contract 6}
  genset_trip: {payload: {genset: [1, 2], confirmed: boolean}, provenance: "contract 6; fault_signatures.genset_trip"}
  genset_restart: {payload: {genset: [1, 2], expected_end_t_s: number}, provenance: "contract 6; fault_signatures.genset_restart"}
  cooling_degraded: {payload: {pump: [1, 2], factor: number, confirmed: boolean}, provenance: "contract 6; fault_signatures.cooling_degraded"}
  guest_report: {payload: {guest: guest, fields: object}, provenance: "contract 6 (the drone's battery)"}
  guest_state: {payload: {guest: guest, activity: string, mode: string}, provenance: contract 6}
  guest_overconsumption: {payload: {guest: guest, overdraw_pct: number}, provenance: "contract 6; derivations.overdraw"}
  guest_request: {payload: {guest: guest, mode: string, kw: number, interruptible: boolean}, provenance: "new: a guest asks for a mode (scenario_b g3_charge_requests)"}
  crew_change: {payload: {crew_aboard: [14, 6, 0]}, provenance: contract 6}
  deck_report: {payload: {deck: [clear, not_clear], wind_kn: "number?"}, optional: [wind_kn], provenance: "contract 6; the landing officer's report (hlo_deck_report, hlo_wind_kn)"}
  deck_sweep: {payload: {result: [clear, not_clear]}, provenance: "new: a crew sweep (last_sweep)"}
  bridge_answer: {payload: {request_seq: integer, answer: [confirmed, denied]}, provenance: "new: the bridge answers one request (bridge_requests)"}
  standing_plan: {payload: {state: [approved, withdrawn]}, provenance: "new: the bridge approves or withdraws a standing plan"}
  emission_change: {payload: {emission: [normal, silent]}, provenance: contract 6}
  feed_drop: {payload: {feed: feed, until_t_s: "number?"}, provenance: "contract 6; the simulator omits that feed's signals from the frames until until_t_s (null: until further notice)"}
  safety_request: {payload: {request: [r3_hold_landing, g3_hold_depth, g2_stop_winch, g4_return_home]}, provenance: "assumptions safety_commands.requests; answered from the table built at the last tick"}

# ------------------------------------------------------------------------------------------------ signals
signals:
  # ---------------------------------------------------------------- plant (platform automation, 1 Hz)
  - {name: genset_1_relay_trip, group: plant, kind: plant, type: boolean, producer: simulator, source: plant, feed: pms, rate: 1 Hz,
     fallback: {rule: "casts no vote; a pending trip is held; gensets_online falls back instead"}, read_by: [D4], provenance: "assumptions power.trip_confirm (relay_flag)"}
  - {name: genset_2_relay_trip, group: plant, kind: plant, type: boolean, producer: simulator, source: plant, feed: pms, rate: 1 Hz,
     fallback: {rule: "casts no vote; a pending trip is held; gensets_online falls back instead"}, read_by: [D4], provenance: "assumptions power.trip_confirm (relay_flag)"}
  - {name: genset_1_kw, group: plant, kind: plant, type: number, unit: kW, range: [0, 450], producer: simulator, source: plant, feed: pms, rate: 1 Hz,
     fallback: {rule: "casts no vote; a pending trip is held; gensets_online falls back instead"}, read_by: [D4], provenance: "brief A.1 (2 x about 450 kW); assumptions power.trip_confirm (kw_near_zero)"}
  - {name: genset_2_kw, group: plant, kind: plant, type: number, unit: kW, range: [0, 450], producer: simulator, source: plant, feed: pms, rate: 1 Hz,
     fallback: {rule: "casts no vote; a pending trip is held; gensets_online falls back instead"}, read_by: [D4], provenance: "brief A.1; assumptions power.trip_confirm (kw_near_zero)"}
  - {name: bus_frequency_hz, group: plant, kind: plant, type: number, unit: Hz, range: [0, 70], producer: simulator, source: plant, feed: pms, rate: 1 Hz,
     fallback: {rule: "casts no vote; a pending trip is held; gensets_online falls back instead"}, read_by: [D4], provenance: "assumptions power.trip_confirm (frequency_dip); assumed: a 60 Hz bus"}
  - {name: gensets_online, group: plant, kind: derived, type: integer, values: [1, 2], producer: estimator, source: derived, rate: per tick, confirm: genset_trip,
     inputs: [genset_1_relay_trip, genset_2_relay_trip, genset_1_kw, genset_2_kw, bus_frequency_hz],
     fallback: {value: 1, scope: "admission and arming the D4 ladder only; D4 never acts on a substituted value"}, read_by: [ledger, D1, D4],
     provenance: "brief A.6 (2 or 1 online); confirm_rules.genset_trip; a restart carries a transition (fault_signatures.genset_restart); fallback from stale_feed.falls_to (one down)"}
  - {name: tripped_genset, group: plant, kind: derived, type: enum, values: [none, genset_1, genset_2], producer: estimator, source: derived, rate: per tick, confirm: genset_trip,
     inputs: [genset_1_relay_trip, genset_2_relay_trip, genset_1_kw, genset_2_kw, bus_frequency_hz],
     fallback: {rule: "keeps the last confirmed value"}, read_by: [ledger, record], provenance: "brief A.9 (a line may be lost depending on which genset tripped); assumptions power.line_lost_on_trip none"}
  - {name: chw_pump_1_running, group: plant, kind: plant, type: boolean, producer: simulator, source: plant, feed: chw, rate: 1 Hz,
     fallback: {rule: "casts no vote; cooling_state falls back instead"}, read_by: [D4, record], provenance: "assumptions heat.degraded_means (one pump of two)"}
  - {name: chw_pump_2_running, group: plant, kind: plant, type: boolean, producer: simulator, source: plant, feed: chw, rate: 1 Hz,
     fallback: {rule: "casts no vote; cooling_state falls back instead"}, read_by: [D4, record], provenance: "assumptions heat.degraded_means"}
  - {name: chw_pump_1_alarm, group: plant, kind: plant, type: boolean, producer: simulator, source: plant, feed: chw, rate: 1 Hz,
     fallback: {rule: "casts no vote; cooling_state falls back instead"}, read_by: [D4], provenance: "assumptions heat.degraded_confirm (plant alarm)"}
  - {name: chw_pump_2_alarm, group: plant, kind: plant, type: boolean, producer: simulator, source: plant, feed: chw, rate: 1 Hz,
     fallback: {rule: "casts no vote; cooling_state falls back instead"}, read_by: [D4], provenance: "assumptions heat.degraded_confirm (plant alarm)"}
  - {name: chw_flow_pct, group: plant, kind: plant, type: number, unit: "% of nominal", range: [0, 150], producer: simulator, source: plant, feed: chw, rate: 1 Hz,
     fallback: {rule: "casts no vote; cooling_state falls back instead"}, read_by: [D4], provenance: "assumptions heat.degraded_confirm (flow); threshold in confirm_rules.cooling_degraded"}
  - {name: chw_supply_c, group: plant, kind: plant, type: number, unit: C, range: [0, 40], producer: simulator, source: plant, feed: chw, rate: 1 Hz,
     fallback: {rule: "casts no vote; cooling_state falls back instead"}, read_by: [D4], provenance: "assumptions heat.degraded_confirm (delta-T)"}
  - {name: chw_return_c, group: plant, kind: plant, type: number, unit: C, range: [0, 40], producer: simulator, source: plant, feed: chw, rate: 1 Hz,
     fallback: {rule: "casts no vote; cooling_state falls back instead"}, read_by: [D4], provenance: "assumptions heat.degraded_confirm (delta-T)"}
  - {name: cooling_state, group: plant, kind: derived, type: enum, values: [nominal, degraded], producer: estimator, source: derived, rate: per tick, confirm: cooling_degraded,
     inputs: [chw_pump_1_running, chw_pump_2_running, chw_pump_1_alarm, chw_pump_2_alarm, chw_flow_pct, chw_supply_c, chw_return_c],
     fallback: {value: degraded, scope: "admission and arming the D4 ladder only; D4 never acts on a substituted value"}, read_by: [ledger, D1, D4],
     provenance: "brief A.2, A.6 (nominal or -40 %, no repair at sea); confirm_rules.cooling_degraded; fallback from stale_feed.falls_to"}

  # ---------------------------------------------------------------- ship state (Siddharth's A.6 machine, reported 1 Hz)
  - {name: course, group: ship_state, kind: ship_state, type: enum, values: [free, steady], producer: simulator, source: plant, feed: nav, rate: 1 Hz,
     fallback: {value: free}, read_by: [D3, link, window], provenance: "brief A.6 (1-3 min to settle); assumptions ship_state.course; stale_feed.falls_to"}
  - {name: speed_kn, group: ship_state, kind: ship_state, type: number, unit: kn, range: [0, 25], nullable: true, producer: simulator, source: plant, feed: nav, rate: 1 Hz, grace_s: 30,
     fallback: {value: null, rule: "null fails every numeric condition, which closes the flight deck and the ramp; the reserve takes the fast band's 150 kW"}, read_by: [ledger, D3, window],
     provenance: "assumed: A.6 gives bands only, but G3 3 kn, G4 5-12 kn, G3's ramp and the A.11 window 4-8 kn and G2 5 kn need knots (freeze_check delta-2, OPEN_QUESTIONS #44)"}
  - {name: speed_band, group: ship_state, kind: derived, type: enum, values: [stopped, slow, cruise, fast], producer: estimator, source: derived, rate: per tick, inputs: [speed_kn],
     fallback: {value: fast}, read_by: [record], provenance: "brief A.6 (2-5 min per band); derivations.speed_band; display only"}
  - {name: noise, group: ship_state, kind: ship_state, type: enum, values: [quiet, normal, manoeuvring], producer: simulator, source: plant, feed: nav, rate: 1 Hz,
     fallback: {value: manoeuvring}, read_by: [D3, link], provenance: "brief A.6 (2-4 min to go quiet, instant to leave); assumed fallback: not quiet, so the acoustic link counts as down"}
  - {name: situation, group: ship_state, kind: ship_state, type: enum, values: [alongside, at_sea], producer: simulator, source: [scenario, laptop], feed: nav, rate: 1 Hz,
     fallback: {value: at_sea}, read_by: [D1, window], provenance: "brief Scenario A and A.11 (alongside is the only place the whole configuration can change)"}
  - {name: deck_flight_deck, group: ship_state, kind: ship_state, type: enum, values: [clear, occupied], producer: simulator, source: [plant, crew_report], feed: deck, rate: 1 Hz,
     fallback: {value: occupied, rule: "a fresh hlo_deck_report replaces it while a G4 hard limit is active (fallback_policy.hard_limit)"}, read_by: [D3, D5, window],
     provenance: "brief A.6 deck state, per zone (assumptions positions.flight_deck.zone); stale_feed.falls_to"}
  - {name: deck_bays, group: ship_state, kind: ship_state, type: enum, values: [clear, occupied], producer: simulator, source: [plant, crew_report], feed: deck, rate: 1 Hz,
     fallback: {value: occupied}, read_by: [D3], provenance: "brief A.6 deck state, per zone (positions.bay1/bay2.zone bay); G2 deck_around_bay"}
  - {name: ramp, group: ship_state, kind: ship_state, type: enum, values: [free, in_use], producer: simulator, source: plant, feed: deck, rate: 1 Hz,
     fallback: {value: in_use}, read_by: [D3, window], provenance: "assumed: brief A.3 (one craft; flight deck and ramp mutually exclusive) needs a ramp state that A.6 does not list; derivations.effects"}
  - {name: deck_machinery, group: ship_state, kind: ship_state, type: boolean, producer: simulator, source: plant, feed: deck, rate: 1 Hz,
     fallback: {value: true}, read_by: [D3, D5, link, safety], provenance: "assumed: brief A.6 (winches, hangar doors) and A.5 need a running-machinery state that A.6 does not list; SENSOR_CATALOG winch unknown means in use; derivations.effects"}
  - {name: deck_activity_since_sweep, group: ship_state, kind: ship_state, type: boolean, producer: simulator, source: plant, feed: deck, rate: 1 Hz,
     fallback: {value: true}, read_by: [D5], provenance: "assumptions rules.r3.latched_deck (a hatch, a hangar door, a winch; G4's own launch excepted)"}
  - {name: emission, group: ship_state, kind: ship_state, type: enum, values: [normal, silent], producer: simulator, source: [plant, laptop], feed: emission, rate: 1 Hz,
     fallback: {by_use: {conflicts: normal, link_budget: silent}}, read_by: [ledger, D3, D4, safety],
     provenance: "brief A.6 (instant to go silent; leaving is a mission decision); fallback from research/SENSOR_CATALOG.md (emission state)"}
  - {name: radar_transmitting, group: ship_state, kind: ship_state, type: boolean, producer: simulator, source: plant, feed: emission, rate: 1 Hz,
     fallback: {value: true}, read_by: [ledger, record], provenance: "assumed: Annex B G1 loses 30 % while the ship's own radar transmits nearby, unless quiet radio is declared"}
  - {name: heading_free, group: ship_state, kind: derived, type: boolean, producer: estimator, source: derived, rate: per tick, inputs: ["*.activity"],
     fallback: {value: false}, read_by: [D3], provenance: "assumed: G4's turn_into_wind: free read as 'no running activity pins the heading' (derivations.effects); A.3 still asks a steady course for the landing itself"}
  - {name: deck_machinery_permitted, group: ship_state, kind: derived, type: boolean, producer: estimator, source: derived, rate: per tick, inputs: [emission, "*.activity"],
     fallback: {value: false}, read_by: [D3, safety], provenance: "G2's deck_machinery_allowed: true; derivations.deck_machinery_permitted"}
  - {name: flight_deck_ops, group: ship_state, kind: derived, type: enum, values: [free, in_use], producer: estimator, source: derived, rate: per tick, inputs: ["*.activity"],
     fallback: {value: in_use}, read_by: [D3, window], provenance: "brief A.3 (flight deck and ramp mutually exclusive); in_use while G4.launch_recovery runs"}

  # ---------------------------------------------------------------- environment
  - {name: seawater_c, group: environment, kind: environment, type: number, unit: C, range: [-2, 40], producer: simulator, source: [scenario, public_data, plant], feed: public_data, rate: hourly,
     fallback: {value: 30, rule: "the worse (higher) of the last value and 30 C"}, read_by: [ledger, D1, D4],
     provenance: "brief A.2, A.10 (judge cooling at 30 C); assumed: hourly public data tolerates two missed hours"}
  - {name: sea_state, group: environment, kind: environment, type: integer, unit: Douglas, range: [0, 9], producer: simulator, source: [scenario, public_data], feed: public_data, rate: hourly,
     fallback: {value: 5, rule: "the worse of the last value and the envelope bound 5"}, read_by: [D3, window, D1],
     provenance: "brief A.3, A.10, A.11 (thresholds 3, 4, 5); Scenario B gives no value"}
  - {name: wind_kn, group: environment, kind: environment, type: number, unit: kn, range: [0, 80], producer: simulator, source: [plant, crew_report], feed: anemometer, rate: 1 Hz, grace_s: 30,
     fallback: {value: 30, rule: "the worse of the last value and the envelope bound 30 kn, which closes the flight deck (25 kn); a fresh hlo_wind_kn replaces it while a G4 hard limit is active"}, read_by: [D3, window],
     provenance: "brief A.3 (25 kn), A.10 (30 kn), A.11 (20 kn); assumed: the ship's anemometer, not the drone's report"}
  - {name: wind_from_deg, group: environment, kind: environment, type: number, unit: deg, range: [0, 360], nullable: true, producer: simulator, source: plant, feed: anemometer, rate: 1 Hz, grace_s: 30,
     fallback: {value: null, rule: "null: a turn into the wind cannot be planned, so G4 launch and recovery wait"}, read_by: [D3],
     provenance: "assumed: G4's 'freedom to turn into wind' needs a direction; no file has one"}

  # ---------------------------------------------------------------- links (comms system, 1 Hz)
  - {name: satcom_mbps, group: links, kind: link, type: number, unit: Mbit/s, range: [0, 8], producer: simulator, source: plant, feed: comms, rate: 1 Hz,
     fallback: {value: 0}, read_by: [ledger], provenance: "brief A.5 (2-8 Mbit/s shared, 70-95 % available, zero in silence)"}
  - {name: los_radio_mbps, group: links, kind: link, type: number, unit: Mbit/s, range: [0, 20], producer: simulator, source: plant, feed: comms, rate: 1 Hz,
     fallback: {value: 0}, read_by: [ledger], provenance: "brief A.5 (1-20 Mbit/s, zero in silence)"}
  - {name: acoustic_link_up, group: links, kind: derived, type: boolean, producer: estimator, source: derived, rate: per tick, inputs: [course, noise, deck_machinery, run.layered_water],
     fallback: {value: false}, read_by: [D3, safety, ledger], provenance: "derivations.acoustic_link_up; stale_feed.falls_to (acoustic_link: down)"}
  - {name: acoustic_kbps, group: links, kind: derived, type: number, unit: kbit/s, range: [0, 5], producer: estimator, source: derived, rate: per tick, inputs: [acoustic_link_up],
     fallback: {value: 0}, read_by: [ledger], provenance: "derivations.acoustic_kbps"}

  # ---------------------------------------------------------------- crew (laptop inputs, emitted by the simulator every tick)
  - {name: crew_aboard, group: crew, kind: crew, type: integer, values: [14, 6, 0], producer: laptop, source: laptop, feed: laptop, rate: 1 Hz,
     fallback: {rule: "the next lower level: 14 to 6, 6 to 0"}, read_by: [D1, D3, D5], provenance: "brief A.6 and Scenario C (14, 6, 0); docs/SCENARIO_C_MEMO.md (unreported: assume the next lower)"}
  - {name: people_available, group: crew, kind: crew, type: integer, unit: people, range: [0, 14], producer: laptop, source: crew_report, feed: laptop, rate: 1 Hz,
     fallback: {value: 0}, read_by: [window, D3], provenance: "brief A.11 (3 people for the flight deck, 4 for the ramp); G6 start needs 2"}
  - {name: bridge_requests, group: crew, kind: crew, type: requests, producer: laptop, source: crew_report, feed: laptop, rate: 1 Hz,
     wait_s: {by_crew: {14: 60, 6: 180, 0: 0}},
     fallback: {value: [], rule: "a lost feed leaves every open request unanswered, which counts as no"}, read_by: [D3, D5],
     provenance: "brief A.6 (15-60 s, 1-3 min, impossible uncrewed); assumptions crew.confirm_s. One entry per open request: {request_seq, rule, state, asked_t_s, answered_t_s}. A pending request waits wait_s and then counts as no; a given answer holds for its request_seq until that decision closes, and the entry then leaves the list."}
  - {name: hlo_deck_report, group: crew, kind: crew, type: enum, values: [none, clear, not_clear], producer: laptop, source: crew_report, feed: laptop, rate: 1 Hz, expires_after_s: 300,
     fallback: {value: not_clear, rule: "a lost feed, or a clear report older than expires_after_s (counted from reported_t_s), counts as not clear"}, read_by: [D5, safety],
     provenance: "assumptions rules.r3.deck_evidence; assumed: a clear report is good for 5 min, the slow end of A.6's clearing time"}
  - {name: hlo_wind_kn, group: crew, kind: crew, type: number, unit: kn, range: [0, 80], nullable: true, producer: laptop, source: crew_report, feed: laptop, rate: 1 Hz, expires_after_s: 120,
     fallback: {value: null}, read_by: [D3, D5], provenance: "assumed: the landing officer reads the deck anemometer by hand; replaces a stale wind_kn only while a G4 hard limit is active (fallback_policy.hard_limit); good for 2 min"}
  - {name: standing_plan, group: crew, kind: crew, type: enum, values: [none, approved], producer: laptop, source: crew_report, feed: laptop, rate: 1 Hz, expires_after_s: 5400,
     fallback: {value: none, rule: "a lost feed, a plan older than expires_after_s, or a change of guests, priorities or crew level, leaves no plan"}, read_by: [D5],
     provenance: "assumptions rules.r3.confirm (6 aboard); assumed: good for one 90 min sortie; lapses per docs/SCENARIO_C_MEMO.md"}
  - {name: last_sweep, group: crew, kind: crew, type: sweep, nullable: true, producer: laptop, source: crew_report, feed: laptop, rate: 1 Hz,
     fallback: {value: null, rule: "no sweep known: the deck is not latched clear"}, read_by: [D5],
     provenance: "assumptions rules.r3.latched_deck (latched clear at the last crew sweep); set by the laptop event deck_sweep {result}"}
  - {name: deck_latched_clear, group: crew, kind: derived, type: boolean, producer: estimator, source: derived, rate: per tick, inputs: [last_sweep, deck_activity_since_sweep],
     fallback: {value: false}, read_by: [D5], provenance: "derivations.deck_latched_clear; brief A.6 (uncrewed only if already clear)"}

  # ---------------------------------------------------------------- guests: every installed guest reports these
  # Mode, draw and demand come from the guest's connection on the ship (guest_meter). Activity comes from the guest.
  # kw_actual ranges are twice the card's highest mode, so an over-draw stays a reading.
  - {name: G1.mode, group: guests, kind: guest, type: enum, values: [full, "off"], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's highest-draw mode"}, read_by: [ledger, D4], provenance: manifests/G1.yaml modes}
  - {name: G1.activity, group: guests, kind: guest, type: enum, values: [none, listening], producer: simulator, source: guest_report, feed: guest_backbone, rate: 1 Hz, fallback: {rule: "the last value"}, read_by: [D3], provenance: activities.G1}
  - {name: G1.kw_actual, group: guests, kind: guest, type: number, unit: kW, range: [0, 3], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's declared peak, or nominal without one"}, read_by: [ledger], provenance: "brief synthetic feeds (per-guest consumption); over-draw 10-20 % (brief State)"}
  - {name: G1.data_demand, group: guests, kind: guest, type: rates, producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's nominal rates"}, read_by: [ledger], provenance: manifests/G1.yaml consumes}
  - {name: G1.overdraw_pct, group: guests, kind: derived, type: number, unit: "%", range: [-100, 1000], nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G1.kw_actual, G1.mode], fallback: {value: null}, read_by: [ledger, D4, record], provenance: derivations.overdraw}
  - {name: G2.mode, group: guests, kind: guest, type: enum, values: [winch, sampling, standby, "off"], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's highest-draw mode"}, read_by: [ledger, D4], provenance: manifests/G2.yaml modes}
  - {name: G2.activity, group: guests, kind: guest, type: enum, values: [none, probe, winch], producer: simulator, source: guest_report, feed: guest_backbone, rate: 1 Hz, fallback: {value: winch}, read_by: [D3, safety], provenance: "activities.G2; SENSOR_CATALOG winch unknown means in use"}
  - {name: G2.kw_actual, group: guests, kind: guest, type: number, unit: kW, range: [0, 40], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's declared peak, or nominal without one"}, read_by: [ledger], provenance: "brief synthetic feeds"}
  - {name: G2.data_demand, group: guests, kind: guest, type: rates, producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's nominal rates"}, read_by: [ledger], provenance: manifests/G2.yaml consumes}
  - {name: G2.overdraw_pct, group: guests, kind: derived, type: number, unit: "%", range: [-100, 1000], nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G2.kw_actual, G2.mode], fallback: {value: null}, read_by: [ledger, D4, record], provenance: derivations.overdraw}
  - {name: G2.mode_ends_t_s, group: guests, kind: derived, type: ship_time, nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G2.mode], fallback: {rule: "keeps the last value"}, read_by: [ledger, D4], provenance: "manifests/G2.yaml winch duration_s 300; derivations.mode_ends"}
  - {name: G3.mode, group: guests, kind: guest, type: enum, values: [charging, standby, "off"], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's highest-draw mode"}, read_by: [ledger, D4], provenance: manifests/G3.yaml modes}
  - {name: G3.activity, group: guests, kind: guest, type: enum, values: [none, surveying, launch_recovery, holding_depth, holding_at_sea, on_cradle], producer: simulator, source: guest_report, feed: g3_acoustic, rate: event,
     fallback: {rule: "the last reported activity, kept and substituted; surveying only if the last report was surveying"}, read_by: [D3, D1, safety, window],
     provenance: "activities.G3; feeds.g3_acoustic (stale only while the link is up)"}
  - {name: G3.kw_actual, group: guests, kind: guest, type: number, unit: kW, range: [0, 50], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's declared peak, or nominal without one"}, read_by: [ledger], provenance: "brief synthetic feeds; metered at the cradle"}
  - {name: G3.data_demand, group: guests, kind: guest, type: rates, producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's nominal rates"}, read_by: [ledger], provenance: manifests/G3.yaml consumes}
  - {name: G3.overdraw_pct, group: guests, kind: derived, type: number, unit: "%", range: [-100, 1000], nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G3.kw_actual, G3.mode], fallback: {value: null}, read_by: [ledger, D4, record], provenance: derivations.overdraw}
  - {name: G3.mode_ends_t_s, group: guests, kind: derived, type: ship_time, nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G3.mode], fallback: {rule: "keeps the last value"}, read_by: [ledger, D4], provenance: "manifests/G3.yaml charging duration_s 3600, not interruptible"}
  - {name: G3.leg_state, group: guests, kind: guest, type: enum, values: [none, running, paused, aborted, done], producer: simulator, source: guest_report, feed: g3_acoustic, rate: event,
     fallback: {rule: "the last reported state, kept and substituted"}, read_by: [D3, record], provenance: "tests/oracles minute_8 g3.leg paused or aborted"}
  - {name: G3.leg_started_t_s, group: guests, kind: guest, type: ship_time, nullable: true, producer: simulator, source: guest_report, feed: g3_acoustic, rate: event,
     fallback: {rule: "keeps the last value"}, read_by: [D3], provenance: "brief Scenario B (40 min leg, derivations.g3_leg)"}
  - {name: G3.leg_flown_s, group: guests, kind: guest, type: number, unit: s, range: [0, 2400], producer: simulator, source: guest_report, feed: g3_acoustic, rate: event,
     fallback: {rule: "keeps the last value; the cost to G3 is computed from it and says it is old"}, read_by: [D3, record], provenance: "tests/oracles minute_8 (8 min flown); derivations.g3_leg"}
  - {name: G3.hold_ack, group: guests, kind: guest, type: boolean, producer: simulator, source: guest_report, feed: g3_acoustic, rate: event,
     fallback: {value: false}, read_by: [D3, safety], provenance: "assumptions safety_commands (G3 hold depth); data.acoustic_latency_s 10-60 s per message"}
  - {name: G4.mode, group: guests, kind: guest, type: enum, values: [fast_charge, charge, standby, "off"], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's highest-draw mode"}, read_by: [ledger, D4], provenance: manifests/G4.yaml modes}
  - {name: G4.activity, group: guests, kind: guest, type: enum, values: [none, launch_recovery, airborne, landed], producer: simulator, source: guest_report, feed: g4_telemetry, rate: 1 Hz,
     fallback: {rule: "the last value, kept and substituted; airborne only if the last value was airborne or launch_recovery"}, read_by: [D3, D5, safety], provenance: "activities.G4; feeds.g4_telemetry heartbeat"}
  - {name: G4.kw_actual, group: guests, kind: guest, type: number, unit: kW, range: [0, 70], producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's declared peak, or nominal without one"}, read_by: [ledger], provenance: "brief synthetic feeds; metered at the hangar"}
  - {name: G4.data_demand, group: guests, kind: guest, type: rates, producer: simulator, source: plant, feed: guest_meter, rate: 1 Hz, fallback: {rule: "the card's nominal rates"}, read_by: [ledger], provenance: manifests/G4.yaml consumes}
  - {name: G4.overdraw_pct, group: guests, kind: derived, type: number, unit: "%", range: [-100, 1000], nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G4.kw_actual, G4.mode], fallback: {value: null}, read_by: [ledger, D4, record], provenance: derivations.overdraw}
  - {name: G4.mode_ends_t_s, group: guests, kind: derived, type: ship_time, nullable: true, producer: estimator, source: derived, rate: per tick, inputs: [G4.mode], fallback: {rule: "keeps the last value"}, read_by: [ledger, D4], provenance: "manifests/G4.yaml fast_charge duration_s 1200 (minutes 17 to 37 in Scenario B)"}
  - {name: G4.battery_pct, group: guests, kind: guest, type: number, unit: "%", range: [0, 100], nullable: true, producer: simulator, source: guest_report, feed: g4_telemetry, rate: event,
